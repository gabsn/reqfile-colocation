name: digest
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render digest
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          from uptime.digest import collect

          results = collect()
          down = [r["url"] for r in results if not r["up"]]
          if not down:
              print(f"All {len(results)} targets up.")
          else:
              print(f"{len(down)} of {len(results)} targets down:")
              for url in down:
                  print(f"- {url}")
          EOF
